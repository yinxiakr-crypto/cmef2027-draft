<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SINOSEOUL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Pretendard, "Malgun Gothic", sans-serif; }
    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      background:
        linear-gradient(rgba(40, 40, 40, 0.45), rgba(40, 40, 40, 0.45)),
        url("https://sinoseoul.co.kr/public/images/intro/intro_img_1.jpg") center/cover no-repeat;
    }
    h1 { margin: 0; font-size: clamp(42px, 6vw, 64px); font-weight: 750; letter-spacing: 0.04em; }
    .sub { margin: 10px 0 0; font-size: 20px; font-weight: 500; }
    .pills { display: flex; gap: 16px; margin-top: 36px; flex-wrap: wrap; justify-content: center; }
    .pills a {
      min-width: min(220px, 100%);
      min-height: 48px;
      padding: 12px 22px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 28px;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.08);
    }
    .pills a:hover { background: rgba(255, 255, 255, 0.2); }
    .depth { margin: 28px 0 0; font-size: 13px; opacity: 0.85; }
    @media (max-width: 640px) {
      .stage { padding: 32px 20px; }
      .pills { width: min(320px, 100%); }
      .pills a { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <h1>SINOSEOUL</h1>
    <p class="sub">Business Working Platform</p>
    <div class="pills">
      <a href="https://sinoseoul.co.kr/main/intro">Market Authorization</a>
      <a href="marketing.html">Marketing</a>
    </div>
    <p class="depth">1. 플랫폼</p>
  </main>
</body>
</html>
