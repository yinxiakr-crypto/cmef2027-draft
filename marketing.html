<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SINOSEOUL MARKETING</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Pretendard, "Malgun Gothic", sans-serif; color: #fff; }
    .split { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .info {
      background: #004448;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 8vw;
    }
    .photo {
      background: url("https://sinoseoul.co.kr/public/images/marketing/img_intro.jpg") center/cover no-repeat;
    }
    h1 { margin: 0; font-size: clamp(40px, 5vw, 56px); letter-spacing: 0.04em; }
    .lead { margin: 12px 0 0; font-size: 18px; }
    .china { position: relative; margin-top: 36px; max-width: 280px; }
    .china > button {
      width: 100%;
      min-height: 64px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font: inherit;
      cursor: pointer;
      text-align: center;
    }
    .china > button b { display: block; font-size: 18px; }
    .china > button span { display: block; margin-top: 2px; font-size: 11px; letter-spacing: 0.14em; opacity: 0.8; }
    .drop {
      position: absolute;
      left: 0;
      right: 0;
      margin-top: 8px;
      background: #fff;
      color: #222;
      border-radius: 12px;
      overflow: hidden;
    }
    .drop[hidden] { display: none; }
    .drop a { display: block; padding: 14px 16px; color: inherit; text-decoration: none; border-bottom: 1px solid #eee; }
    .drop a:hover { background: #f6f4ef; }
    .drop b { display: block; font-size: 16px; }
    .drop span { display: block; margin-top: 2px; color: #777; font-size: 12px; }
    .depth { margin: 28px 0 0; font-size: 13px; opacity: 0.8; }
    .depth a { color: #fff; }
    @media (max-width: 800px) {
      .split { grid-template-columns: 1fr; }
      .photo { min-height: 220px; order: -1; }
      .info { padding: 36px 24px 48px; }
      .china { max-width: none; }
    }
  </style>
</head>
<body>
  <main class="split">
    <section class="info">
      <h1>SINOSEOUL</h1>
      <p class="lead">의료 산업의 미래를 만들어가는 의료기기 전시회</p>
      <div class="china">
        <button type="button" id="chinaBtn" aria-expanded="false" aria-controls="chinaMenu">
          <b>중국</b>
          <span>CHINA</span>
        </button>
        <div class="drop" id="chinaMenu" hidden>
          <a href="cmef.html"><b>CMEF</b><span>China International Medical Equipment Fair</span></a>
          <a href="cds.html"><b>CDS</b><span>China Dental Show</span></a>
          <a href="chcc.html"><b>CHCC</b><span>China Hospital Construction Conference</span></a>
        </div>
      </div>
      <p class="depth"><a href="index.html">1. 플랫폼</a> · 2. 마케팅 · 중국</p>
    </section>
    <div class="photo"></div>
  </main>
  <script>
    var btn = document.getElementById("chinaBtn");
    var menu = document.getElementById("chinaMenu");
    btn.addEventListener("click", function (event) {
      event.stopPropagation();
      var open = btn.getAttribute("aria-expanded") === "true";
      menu.hidden = open;
      btn.setAttribute("aria-expanded", open ? "false" : "true");
    });
    menu.addEventListener("click", function (event) { event.stopPropagation(); });
    document.addEventListener("click", function () {
      menu.hidden = true;
      btn.setAttribute("aria-expanded", "false");
    });
  </script>
</body>
</html>
